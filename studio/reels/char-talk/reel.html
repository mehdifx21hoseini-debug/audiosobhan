<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8">
<style>
@font-face { font-family: "Vaz"; src: url("../../fonts/Vazirmatn-Black.ttf"); font-weight: 900; }
@font-face { font-family: "Vaz"; src: url("../../fonts/Vazirmatn-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Vaz"; src: url("../../fonts/Vazirmatn-Medium.ttf"); font-weight: 500; }
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Vaz"; color: #f5f7fc; background: #040a1c; }
#bg { position: absolute; inset: 0; filter: blur(40px) brightness(.45) saturate(1.1); transform: scale(1.2); }
#frame { position: absolute; left: 0; top: 330px; width: 1080px; height: 1350px; overflow: hidden; box-shadow: 0 0 0 2px rgba(214,178,112,.5), 0 40px 90px rgba(0,0,0,.6); }
#cv { position: absolute; inset: 0; }
#fvig { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4,10,28,.35) 0%, rgba(4,10,28,0) 18%, rgba(4,10,28,0) 70%, rgba(4,10,28,.7) 100%); }
.abs { position: absolute; } .center { left: 0; right: 0; text-align: center; }
#title { top: 150px; font-weight: 900; font-size: 64px; line-height: 1.25; }
#sub { position: absolute; top: 1545px; left: 50%; transform: translateX(-50%); padding: 20px 42px; border-radius: 40px; width: max-content; max-width: 940px; text-align: center; line-height: 1.55;
  background: rgba(4,10,28,.82); border: 1px solid rgba(214,178,112,.4); font-weight: 700; font-size: 52px; opacity: 0; }
#sub .w { display: inline-block; margin: 0 5px; color: rgba(245,247,252,.42); }
#sub .w.on { color: #fff; } #sub .w.on.g { color: #46d696; } #sub .w.on.y { color: #f0d9a0; }
#brand { position: absolute; top: 1780px; left: 50%; transform: translateX(-50%); height: 84px; padding: 0 26px 0 20px; border-radius: 46px; background: rgba(255,255,255,.95); display: flex; align-items: center; gap: 12px; width: max-content; }
#brand img { height: 62px; } #brand .t1 { font-weight: 900; font-size: 26px; color: #29386c; line-height: 1.1; } #brand .t2 { font-weight: 500; font-size: 16px; color: #b8914a; direction: ltr; text-align: right; }
#grain { position: absolute; inset: -200px; background: url("../../brand/grain.png"); opacity: .06; mix-blend-mode: overlay; }
#black { position: absolute; inset: 0; background: #000; }
#end { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 50% 40%, #1a3572 0%, #0b1a40 50%, #040a1c 100%); }
</style></head>
<body><div id="stage">
  <canvas id="bg" width="540" height="960"></canvas>
  <div class="abs center" id="title">بهم گفتن: <span style="color:#ff6b76">«ترید قماره‌ست.»</span></div>
  <div id="frame"><canvas id="cv" width="1080" height="1350"></canvas><div id="fvig"></div></div>
  <div id="sub"></div>
  <div id="brand"><img src="../../brand/logo_navy_gold.png"><div><div class="t1">آکادمی سبحان صمدی</div><div class="t2">Sobhan Samadi Academy</div></div></div>
  <div id="end">
    <div class="abs" style="left:50%; top:760px; transform:translateX(-50%); width:max-content; white-space:nowrap; padding:32px 54px; border-radius:56px; background:#fff; display:flex; align-items:center; gap:26px; box-shadow:0 0 0 6px rgba(240,217,160,.8)">
      <div><div style="font-weight:900; font-size:58px; color:#29386c">آکادمی سبحان صمدی</div><div style="font-weight:500; font-size:30px; color:#b8914a; direction:ltr; text-align:right">Sobhan Samadi Academy</div></div>
      <img src="../../brand/logo_navy_gold.png" style="height:150px"></div>
    <div class="abs center" style="top:1130px; font-weight:900; font-size:54px">برای رفیق معامله‌گرت بفرست</div>
  </div>
  <div id="grain"></div><div id="black"></div>
</div>
<script src="../../engine/node_modules/gsap/dist/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s), TL = window.TL, T = window.DUR = TL.T, S = TL.subs, VE = TL.voice_end;
const tl = gsap.timeline({ paused: true }), cv = $("#cv"), cx = cv.getContext("2d"), bg = $("#bg"), bx = bg.getContext("2d");
const cam = { z: 1.0, x: 0 };
const sub = $("#sub");
function setSub(i) { if (i < 0) { sub.style.opacity = 0; return; } sub.dataset.i = i;
  sub.innerHTML = S[i].text.split(" ").map(w => { let c = ""; if (w[0] === "^") { c = w[1]; w = w.slice(2); } return `<span class="w ${c}">${w}</span>`; }).join(" "); sub.style.opacity = 1; }
S.forEach((s, i) => tl.call(setSub, [i], s.dst[0] - .03)); tl.call(setSub, [-1], VE + .1);
const karaoke = t => { const i = +sub.dataset.i; if (isNaN(i) || sub.style.opacity == 0) return; sub.querySelectorAll(".w").forEach((w, k) => w.classList.toggle("on", t >= S[i].wt[k][0] - .02)); };
tl.to("#black", { opacity: 0, duration: .4 }, 0)
  .fromTo("#title", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, .1)
  .fromTo(cam, { z: 1.12 }, { z: 1.0, duration: VE, ease: "sine.inOut" }, 0)
  .fromTo("#frame", { opacity: 0, scale: .94 }, { opacity: 1, scale: 1, duration: .5, ease: "power3.out" }, 0)
  .to(["#title", "#frame", "#sub", "#brand"], { opacity: 0, duration: .3 }, VE + .2)
  .to("#end", { opacity: 1, duration: .35 }, VE + .25).to("#black", { opacity: 1, duration: .3 }, T - .3);
tl.set({}, {}, T);
// frames: SadTalker output (landscape) -> 4:5 crop centred on the face
const img = new Image(); let last = -1;
async function draw(t) {
  const idx = Math.min(TL.frames - 1, Math.max(0, Math.floor(t * TL.fps_src)));
  if (idx !== last) { img.src = `frames/f_${String(idx + 1).padStart(5, "0")}.jpg`; await img.decode(); last = idx; }
  const W = img.width, H = img.height, ch = H / cam.z, cw = ch * 1080 / 1350, cxs = Math.min(W - cw, Math.max(0, W * .527 - cw / 2)), cys = (H - ch) * .15;
  cx.drawImage(img, cxs, cys, cw, ch, 0, 0, 1080, 1350); bx.drawImage(img, cxs, 0, cw, H, 0, 0, 540, 960);
}
let frame = 0;
window.seek = async t => { tl.seek(t, false); karaoke(t); await draw(Math.min(t, VE)); frame++; $("#grain").style.transform = `translate(${(frame * 37) % 200 - 100}px, ${(frame * 53) % 200 - 100}px)`; };
document.fonts.ready.then(async () => { await window.seek(0); window.ready = true; });
</script></body></html>
