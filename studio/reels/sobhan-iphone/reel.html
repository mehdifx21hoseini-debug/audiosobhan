<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Vaz"; src: url("../../fonts/Vazirmatn-Black.ttf"); font-weight: 900; }
@font-face { font-family: "Vaz"; src: url("../../fonts/Vazirmatn-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: "Vaz"; src: url("../../fonts/Vazirmatn-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Vaz"; src: url("../../fonts/Vazirmatn-Medium.ttf"); font-weight: 500; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Vaz"; color: #fff; }
.abs { position: absolute; }
#cv { position: absolute; inset: 0; }
#vig { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0,0,0,0) 55%, rgba(0,0,0,.38) 100%),
              linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 62%, rgba(0,0,0,.42) 100%); }
#shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3,6,18,.78) 0%, rgba(3,6,18,.55) 45%, rgba(3,6,18,.35) 100%); opacity: 0; }

/* ---------- subtitles ---------- */
#sub { position: absolute; left: 70px; right: 70px; top: 1400px; text-align: center; font-weight: 800; font-size: 60px; line-height: 1.5; opacity: 0;
  text-shadow: 0 2px 4px rgba(0,0,0,.85), 0 4px 22px rgba(0,0,0,.75), 0 0 2px #000; }
#subband { position: absolute; left: 0; right: 0; top: 1250px; height: 520px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.42) 40%, rgba(0,0,0,.42) 70%, rgba(0,0,0,0) 100%); opacity: 0; }
#sub .w { display: inline-block; margin: 0 7px; color: rgba(255,255,255,.74); }
#sub .w.on { color: #fff; }
#sub .w.on.y { color: #f3d58f; } #sub .w.on.g { color: #5fe0a4; } #sub .w.on.r { color: #ff7b85; }
#sub.cta { text-shadow: none; font-size: 52px; white-space: nowrap; left: 20px; right: 20px; }
#sub.cta .inner { display: inline-block; padding: 10px 38px 16px; border-radius: 22px; background: linear-gradient(180deg, #f6dfa6, #d9b36b); box-shadow: 0 16px 40px rgba(0,0,0,.35); }
#sub.cta .w, #sub.cta .w.on { color: #1b1405; }

/* ---------- price card ---------- */
#price { left: 70px; right: 70px; top: 250px; height: 390px; border-radius: 44px; opacity: 0;
  background: linear-gradient(150deg, rgba(26,22,28,.94) 0%, rgba(8,8,11,.95) 60%); border: 1.5px solid rgba(255,255,255,.12);
  box-shadow: 0 40px 90px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); overflow: visible; }
#price .glow { left: 40px; top: 30px; width: 300px; height: 330px; border-radius: 50%; background: radial-gradient(closest-side, rgba(150,40,60,.55), rgba(150,40,60,0)); }
#phone { left: 58px; top: -46px; height: 460px; filter: drop-shadow(0 30px 40px rgba(0,0,0,.6)); }
#price .brand { right: 56px; top: 50px; font-weight: 500; font-size: 26px; letter-spacing: 6px; color: rgba(255,255,255,.55); direction: ltr; }
#price .model { right: 56px; top: 86px; font-weight: 800; font-size: 60px; direction: ltr; letter-spacing: -.5px; }
#price .spec { right: 56px; top: 172px; font-weight: 500; font-size: 29px; color: rgba(255,255,255,.62); }
#price .line { right: 56px; top: 228px; width: 520px; height: 1.5px; background: linear-gradient(270deg, rgba(243,213,143,.7), rgba(243,213,143,0)); }
#price .amt { right: 56px; top: 246px; display: flex; align-items: baseline; gap: 16px; }
#price .num { font-weight: 900; font-size: 84px; line-height: 1.1; background: linear-gradient(180deg, #fbe6b3, #d6ad62); -webkit-background-clip: text; color: transparent; }
#price .cur { font-weight: 700; font-size: 34px; color: rgba(255,255,255,.8); }

/* ---------- quote ---------- */
#quote { left: 80px; right: 80px; top: 250px; opacity: 0; text-align: center; }
#quote .mark { font-family: Georgia, serif; font-size: 190px; line-height: .7; color: #e8c983; height: 110px; }
#quote .txt { font-weight: 800; font-size: 66px; line-height: 1.55; margin-top: 14px; }
#quote .txt .q { display: inline-block; margin: 0 6px; opacity: 0; }
#quote .txt .q.k { color: #f3d58f; }
#quote .attr { margin-top: 34px; display: inline-flex; align-items: center; gap: 18px; }
#quote .attr .bar { width: 70px; height: 2px; background: #e8c983; }
#quote .attr .n { font-weight: 700; font-size: 36px; color: #f3d58f; }
#quote .attr .e { font-weight: 500; font-size: 24px; letter-spacing: 5px; color: rgba(255,255,255,.55); direction: ltr; }

/* ---------- ladder ---------- */
#ladder { left: 90px; right: 90px; top: 210px; height: 470px; opacity: 0; }
#ladder .ttl { right: 0; top: 0; font-weight: 700; font-size: 32px; color: #f3d58f; letter-spacing: .5px; }
.rung { right: 0; height: 104px; display: flex; align-items: center; gap: 24px; opacity: 0; }
.rung .bar { height: 104px; border-radius: 26px; background: linear-gradient(270deg, rgba(95,224,164,.95), rgba(40,150,105,.85)); box-shadow: 0 14px 34px rgba(0,0,0,.35);
  display: flex; align-items: center; padding: 0 34px; font-weight: 900; font-size: 50px; color: #04180f; white-space: nowrap; }
.rung .chk { font-weight: 900; font-size: 40px; color: #5fe0a4; opacity: 0; }

/* ---------- statement ---------- */
#state { left: 70px; right: 70px; top: 270px; opacity: 0; text-align: center; }
#state .l1 { font-weight: 900; font-size: 104px; line-height: 1.25; }
#state .l2 { font-weight: 800; font-size: 64px; line-height: 1.5; margin-top: 10px; }
#state .s { display: inline-block; margin: 0 8px; opacity: 0; }
#state .l1 .s { background: linear-gradient(180deg, #fbe6b3, #d6ad62); -webkit-background-clip: text; color: transparent; }
#state .neg { color: #ff7b85; position: relative; }
#state .uline { margin: 22px auto 0; height: 5px; width: 0; border-radius: 3px; background: linear-gradient(90deg, rgba(243,213,143,0), #f3d58f, rgba(243,213,143,0)); }

/* ---------- outro ---------- */
#outro { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at 50% 42%, rgba(26,53,114,.95) 0%, rgba(8,18,46,.975) 55%, #03081a 100%); }
#pcv { position: absolute; inset: 0; }
#logoWrap { left: 50%; top: 520px; width: 300px; height: 392px; margin-left: -150px; opacity: 0; }
#logoWrap img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 30px rgba(232,201,131,.35)); }
#shine { position: absolute; inset: -10px; -webkit-mask: url("../../brand/logo_white_gold.png") center / contain no-repeat; mask: url("../../brand/logo_white_gold.png") center / contain no-repeat;
  background: linear-gradient(110deg, rgba(255,255,255,0) 35%, rgba(255,247,220,.95) 50%, rgba(255,255,255,0) 65%); background-size: 300% 100%; background-position: 100% 0; }
#o1 { left: 0; right: 0; top: 1050px; text-align: center; font-weight: 900; font-size: 66px; line-height: 1.5; }
#o1 .t { display: inline-block; margin: 0 8px; opacity: 0; }
#o1 .gold { background: linear-gradient(180deg, #fbe6b3, #d6ad62); -webkit-background-clip: text; color: transparent; }
#oline { left: 50%; top: 1290px; width: 0; height: 2px; transform: translateX(-50%); background: linear-gradient(90deg, rgba(232,201,131,0), #e8c983, rgba(232,201,131,0)); }
#o2 { left: 0; right: 0; top: 1320px; text-align: center; font-weight: 500; font-size: 30px; letter-spacing: 12px; color: #e8c983; direction: ltr; opacity: 0; }
#black { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="vig"></div>
  <div id="shade"></div>

  <div class="abs" id="price">
    <div class="abs glow"></div>
    <img class="abs" id="phone" src="iphone18_burgundy.png">
    <div class="abs brand">APPLE</div>
    <div class="abs model">iPhone 18 Pro Max</div>
    <div class="abs spec">۵۱۲ گیگابایت · رم ۱۲ گیگ · زرشکی</div>
    <div class="abs line"></div>
    <div class="abs amt"><span class="num" id="pnum">۰</span><span class="cur">تومان</span></div>
  </div>

  <div class="abs" id="quote">
    <div class="mark">&#8221;</div>
    <div class="txt" id="qtxt"></div>
    <div class="attr"><span class="bar"></span><span class="n">وارن بافت</span><span class="e">WARREN BUFFETT</span><span class="bar"></span></div>
  </div>

  <div class="abs" id="ladder">
    <div class="abs ttl">اول مدیریت، بعد مقدار</div>
    <div class="abs rung" id="r3" style="top:66px"><div class="bar" style="width:900px; justify-content:flex-start">۱۰ میلیارد</div></div>
    <div class="abs rung" id="r2" style="top:196px"><div class="bar" style="width:640px">۱ میلیارد</div><div class="chk">✓</div></div>
    <div class="abs rung" id="r1" style="top:326px"><div class="bar" style="width:420px">۱۰۰ میلیون</div><div class="chk">✓</div></div>
  </div>

  <div class="abs" id="state">
    <div class="l1"><span class="s">ثرو..تمند</span><span class="s">واقعی</span></div>
    <div class="l2"><span class="s">دنبال</span><span class="s">اثبات</span><span class="s">خودش</span><br><span class="s">به</span><span class="s">یک</span><span class="s">شخص</span><span class="s">دیگه</span><span class="s neg">نیست</span></div>
    <div class="uline" id="suline"></div>
  </div>

  <div id="subband"></div>
  <div id="sub"></div>

  <div id="outro">
    <canvas id="pcv" width="1080" height="1920"></canvas>
    <div class="abs" id="logoWrap"><img src="../../brand/logo_white_gold.png"><div id="shine"></div></div>
    <div class="abs" id="o1"><span class="t">ثروت</span><span class="t">واقعی،</span><br><span class="t gold">از</span><span class="t gold">مدیریتِ</span><span class="t gold">امروز</span><span class="t gold">شروع</span><span class="t gold">می‌شه</span></div>
    <div class="abs" id="oline"></div>
    <div class="abs" id="o2">SOBHAN SAMADI</div>
  </div>
  <div id="black"></div>
</div>
<script src="../../engine/node_modules/gsap/dist/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s), TL = window.TL, T = window.DUR = TL.T, S = TL.subs, VE = TL.voice_end;
const tl = gsap.timeline({ paused: true }), cv = $("#cv"), cx = cv.getContext("2d");
const fa = n => n.toLocaleString("fa-IR");

// ---------- camera: alternate punch-in on every jump cut + a few emphasis beats ----------
const EXTRA = [15, 17, 18, 20, 22].map(i => S[i].dst[0]);            // "پس نگو" · "نه قربونت" · "که ۱۰۰ تومنش" · "خیلی‌ها" · "من هر روز"
const EV = [...new Set([...TL.cuts_dst, ...EXTRA])].sort((a, b) => a - b);
const ZS = [1.0, 1.1, 1.02, 1.14, 1.04, 1.12, 1.0, 1.16, 1.06, 1.1, 1.02, 1.13, 1.05, 1.15, 1.0, 1.1];
const focus = [[TL.quote.in, TL.quote.out], [TL.state.in, TL.state.out]];      // slow cinematic push while a card holds the screen
function camZ(t) {
  let k = 0; while (k + 1 < EV.length && EV[k + 1] <= t) k++;
  const a = EV[k], b = k + 1 < EV.length ? EV[k + 1] : VE, z = ZS[k % ZS.length] * (1 + .025 * Math.min(1, (t - a) / Math.max(.5, b - a)));
  let f = 1; for (const [p, q] of focus) if (t > p && t < q + .6) { const u = Math.min(1, (t - p) / (q - p)), o = t > q ? 1 - (t - q) / .6 : 1; f = 1 + .07 * (u * u * (3 - 2 * u)) * o; }
  return z * f;
}

// ---------- subtitles ----------
const sub = $("#sub");
const hide = [[TL.price.in, TL.price.out], [TL.quote.in, TL.quote.out], [TL.state.in, TL.state.out]];
function setSub(i) {
  if (i < 0) { sub.style.opacity = 0; sub.dataset.i = ""; return; }
  const last = i === S.length - 1;
  const html = S[i].text.split(" ").map(w => { let c = ""; if (w[0] === "^") { c = w[1]; w = w.slice(2); } return `<span class="w ${c}">${w}</span>`; }).join(" ");
  sub.className = last ? "cta" : ""; sub.innerHTML = last ? `<span class="inner">${html}</span>` : html; sub.dataset.i = i;
}
function bandAt(t) {
  let o = Math.min(1, t / .3) * Math.min(1, Math.max(0, (S[S.length - 1].dst[0] - .1 - t) / .3));
  for (const [a, b] of hide) { if (t > a - .3 && t < b + .3) o = Math.min(o, Math.max(0, Math.max(a - t, t - b) / .3)); }
  $("#subband").style.opacity = o;
}
function subAt(t) { bandAt(t);
  let i = -1; for (let k = 0; k < S.length; k++) { const nx = k + 1 < S.length ? S[k + 1].dst[0] - .04 : VE + .15; if (t >= S[k].dst[0] - .04 && t < Math.min(nx, S[k].dst[1] + .7)) i = k; }
  if (String(i) !== sub.dataset.i) setSub(i);
  if (i < 0) { sub.style.opacity = 0; return; }
  const age = t - (S[i].dst[0] - .04), ws = sub.querySelectorAll(".w");
  sub.style.opacity = Math.min(1, age / .08); sub.style.transform = `translateY(${(1 - Math.min(1, age / .14)) * 14}px)`;
  ws.forEach((w, k) => w.classList.toggle("on", t >= S[i].wt[k][0] - .03));
}

// ---------- price card ----------
const P = TL.price, pn = { v: 0 };
tl.fromTo("#price", { opacity: 0, y: 70, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: .5, ease: "power3.out" }, P.in + .05)
  .fromTo("#phone", { rotate: -14, x: -50, y: 30 }, { rotate: -5, x: 0, y: 0, duration: .8, ease: "power3.out" }, P.in + .05)
  .to("#phone", { rotate: -3, y: -8, duration: P.out - P.in, ease: "sine.inOut" }, P.in + .85)
  .fromTo(["#price .brand", "#price .model", "#price .spec", "#price .line", "#price .amt"], { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: .4, stagger: .07, ease: "power2.out" }, P.in + .2)
  .to(pn, { v: 730000000, duration: .75, ease: "power2.out", onUpdate: () => $("#pnum").textContent = fa(Math.round(pn.v / 1e5) * 1e5) }, P.count)
  .fromTo("#price .num", { scale: 1 }, { scale: 1.07, duration: .14, yoyo: true, repeat: 1, transformOrigin: "100% 50%" }, P.count + .75)
  .to("#price", { opacity: 0, y: -40, filter: "blur(10px)", duration: .35, ease: "power2.in" }, P.out - .1);

// ---------- quote ----------
const Q = TL.quote, qt = $("#qtxt"), KEY = new Set([2, 4, 11, 12]);          // سایه · درختی · درختش · کاشته
const QW = ["کسی", "که", "زیر", "سایه‌ی", "یک", "درختی", "نشسته،", "سال‌ها", "قبل", "درختش", "رو", "کاشته", ""];
Q.words.forEach(([t], k) => { if (!QW[k]) return; qt.insertAdjacentHTML("beforeend", `<span class="q${[3, 5, 9, 11].includes(k) ? " k" : ""}">${QW[k]}</span> `); });
const qs = qt.querySelectorAll(".q");
tl.to("#shade", { opacity: 1, duration: .45 }, Q.in - .1).to("#shade", { opacity: 0, duration: .4 }, Q.out - .05)
  .fromTo("#quote", { opacity: 0 }, { opacity: 1, duration: .3 }, Q.in)
  .fromTo("#quote .mark", { opacity: 0, scale: .4, rotate: -20 }, { opacity: 1, scale: 1, rotate: 0, duration: .5, ease: "back.out(2)" }, Q.in)
  .fromTo("#quote .attr", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .45 }, Q.in + .2)
  .to("#quote", { opacity: 0, y: -30, duration: .35 }, Q.out - .1);
qs.forEach((el, k) => tl.fromTo(el, { opacity: 0, y: 16, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: .28, ease: "power2.out" }, Q.words[k][0] - .05));

// ---------- ladder ----------
const Lr = TL.ladder;
tl.fromTo("#ladder", { opacity: 0 }, { opacity: 1, duration: .25 }, Lr.in).fromTo("#ladder .ttl", { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: .35 }, Lr.in);
[["#r1", Lr.r1], ["#r2", Lr.r2], ["#r3", Lr.r3]].forEach(([id, t], k) => {
  tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: .15 }, t - .05).fromTo(id + " .bar", { scaleX: 0, transformOrigin: "100% 50%" }, { scaleX: 1, duration: .45, ease: "power3.out" }, t - .05);
  if (k < 2) tl.fromTo(id + " .chk", { opacity: 0, scale: .3 }, { opacity: 1, scale: 1, duration: .25, ease: "back.out(3)" }, [Lr.r2, Lr.r3][k] - .05);
});
tl.to("#ladder", { opacity: 0, y: -30, duration: .3 }, Lr.out);

// ---------- statement ----------
const St = TL.state, ss = $$("#state .s");
tl.to("#shade", { opacity: 1, duration: .4 }, St.in - .1).to("#shade", { opacity: 0, duration: .4 }, St.out)
  .set("#state", { opacity: 1 }, St.in).to("#state", { opacity: 0, y: -30, duration: .35 }, St.out)
  .to("#suline", { width: 620, duration: .6, ease: "power2.out" }, St.w[9] - .05);
ss.forEach((el, k) => tl.fromTo(el, { opacity: 0, y: k < 2 ? 40 : 18, scale: k < 2 ? 1.25 : 1, filter: "blur(8px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: k < 2 ? .4 : .26, ease: "power3.out" }, St.w[k] - .06));
tl.fromTo("#state .neg", { scale: 1 }, { scale: 1.18, duration: .16, yoyo: true, repeat: 1 }, St.w[9] + .2);

// ---------- outro: particles gather into a ring -> logo forms with a light sweep -> line of text ----------
const pc = $("#pcv").getContext("2d"), N = 140, CX = 540, CY = 716, parts = [];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < N; i++) { const a = rnd() * Math.PI * 2, r = 700 + rnd() * 700, ta = i / N * Math.PI * 2; parts.push({ x0: CX + Math.cos(a) * r, y0: CY + Math.sin(a) * r * 1.3, ta, s: 1.5 + rnd() * 3.5, d: rnd() * .35 }); }
function drawParticles(t) {
  const u = t - VE; pc.clearRect(0, 0, 1080, 1920); if (u < 0) return;
  for (const p of parts) {
    const k = Math.min(1, Math.max(0, (u - .15 - p.d) / 1.05)), e = 1 - Math.pow(1 - k, 3), rot = u * .6;
    const R = 262 + 5 * Math.sin(p.ta * 6 + u * 3), tx = CX + Math.cos(p.ta + rot) * R, ty = CY + Math.sin(p.ta + rot) * R;
    const x = p.x0 + (tx - p.x0) * e + 0, y = p.y0 + (ty - p.y0) * e, fade = u > 1.6 ? Math.max(0, 1 - (u - 1.6) / 1.4) * .7 + .15 : 1;
    pc.globalAlpha = Math.min(1, k * 3) * fade; pc.fillStyle = "#f0d49a"; pc.shadowColor = "#f3d58f"; pc.shadowBlur = 12;
    pc.beginPath(); pc.arc(x, y, p.s, 0, Math.PI * 2); pc.fill();
  }
  pc.globalAlpha = 1;
}
tl.to("#outro", { opacity: 1, duration: .55, ease: "power2.inOut" }, VE + .05)
  .fromTo("#logoWrap", { opacity: 0, scale: .55, filter: "blur(22px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: .75, ease: "expo.out" }, VE + 1.15)
  .fromTo("#shine", { backgroundPosition: "100% 0" }, { backgroundPosition: "-50% 0", duration: .9, ease: "power2.inOut" }, VE + 1.55)
  .to("#logoWrap", { scale: 1.04, duration: 2.5, ease: "sine.out" }, VE + 1.9);
$$("#o1 .t").forEach((el, k) => tl.fromTo(el, { opacity: 0, y: 24, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: .35, ease: "power2.out" }, VE + 1.95 + k * .12));
tl.to("#oline", { width: 560, duration: .6, ease: "power2.out" }, VE + 2.8).fromTo("#o2", { opacity: 0, letterSpacing: "4px" }, { opacity: 1, letterSpacing: "12px", duration: .8, ease: "power2.out" }, VE + 2.85)
  .to("#black", { opacity: 1, duration: .35 }, T - .35);
tl.set({}, {}, T);

// ---------- frames ----------
const img = new Image(); let lastIdx = -1;
window.seek = async t => { tl.seek(t, false); subAt(t); drawParticles(t); if (t < VE + 1.2) await drawAt(Math.min(t, VE - .02), t); };
async function drawAt(ft, t) {
  const idx = Math.min(TL.frames - 1, Math.max(0, Math.round(ft * TL.fps_src)));
  if (idx !== lastIdx) { img.src = `frames/f_${String(idx + 1).padStart(5, "0")}.jpg`; await img.decode(); lastIdx = idx; }
  const z = camZ(Math.min(t, VE - .02)), fx = 560, fy = 1000, u = Math.max(0, t - VE);
  cx.save(); cx.filter = `contrast(1.06) saturate(1.06) brightness(${1.01 - Math.min(.35, u * .4)})` + (u > 0 ? ` blur(${Math.min(18, u * 22)}px)` : "");
  const zz = z * (1 + u * .03); cx.translate(fx, fy); cx.scale(zz, zz); cx.translate(-fx, -fy); cx.drawImage(img, 0, 0, 1080, 1920); cx.restore();
}
document.fonts.ready.then(async () => { await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); await window.seek(0); window.ready = true; });
</script>
</body>
</html>
