<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Vaz"; src: url("../../../fonts/Vazirmatn-Black.ttf"); font-weight: 900; }
@font-face { font-family: "Vaz"; src: url("../../../fonts/Vazirmatn-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: "Vaz"; src: url("../../../fonts/Vazirmatn-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Vaz"; src: url("../../../fonts/Vazirmatn-Medium.ttf"); font-weight: 500; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Vaz"; color: #fff; position: relative; }
.bg { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; filter: contrast(1.06) saturate(1.05); }
.full { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
/* captions: clean white, current word in yellow, soft shadow */
.cap { position: absolute; left: 50px; right: 50px; bottom: 360px; text-align: center; font-weight: 900; font-size: 74px; line-height: 1.3;
  text-shadow: 0 3px 6px rgba(0,0,0,.6), 0 8px 30px rgba(0,0,0,.5); }
.cap .now { color: #ffd84a; }
/* photo card: real photo, thin white border, soft shadow, slight tilt */
.photo { position: absolute; border-radius: 26px; overflow: hidden; border: 6px solid #fff; box-shadow: 0 30px 70px rgba(0,0,0,.5); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tag { position: absolute; display: flex; flex-direction: column; gap: 4px; padding: 14px 26px; border-radius: 16px; background: #fff; color: #0b0b0e; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
.tag .n { font-weight: 900; font-size: 40px; } .tag .d { font-weight: 700; font-size: 24px; color: #6b6b73; }
.stock { position: absolute; left: 80px; right: 80px; top: 230px; height: 520px; border-radius: 34px; background: #fff; color: #0b0b0e; box-shadow: 0 30px 70px rgba(0,0,0,.45); padding: 34px 40px; }
.chip { position: absolute; padding: 10px 26px; border-radius: 999px; background: #ffd84a; color: #111; font-weight: 900; font-size: 44px; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
.grain { position: absolute; inset: 0; background: url("../../../brand/grain.png"); opacity: .05; mix-blend-mode: overlay; }
</style></head><body>
<div id="root"></div>
<script>
const SC = new URLSearchParams(location.search).get("s");
const F = n => `../frames/f_${String(n).padStart(5, "0")}.jpg`;
const S = {
  hook: `<img class="bg" src="${F(95)}">
    <div class="photo" style="left:120px; top:190px; width:840px; height:560px; transform:rotate(-2deg)"><img src="../../../reels/sobhan-iphone/kit/ph_iphone.jpg" style="object-position:70% 50%"></div>
    <div class="chip" style="right:150px; top:700px; transform:rotate(2deg)">۷۳۰ میلیون تومان</div>
    <div class="cap">آیفون ۱۸ پرومکس، <span class="now">۷۳۰</span> میلیون تومن</div>`,
  buffett: `<img class="bg" src="${F(560)}">
    <div class="photo" style="right:90px; top:170px; width:560px; height:700px; transform:rotate(2.5deg)"><img src="buffett_photo.jpg" style="object-position:50% 20%"></div>
    <div class="tag" style="right:360px; top:790px; transform:rotate(-1.5deg)"><span class="n" style="direction:ltr">Warren Buffett</span><span class="d">ثروتمندترین سرمایه‌گذار جهان</span></div>
    <div class="cap">این صحبت <span class="now">وارن بافت</span> سال‌های ساله</div>`,
  broll: `<img class="full" src="ph_goldbars_full.jpg" style="object-position:40% 50%; transform:scale(1.08)">
    <div class="full" style="background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,0) 40%, rgba(0,0,0,.55))"></div>
    <div class="cap">که <span class="now">طلا</span> و دلار سرمایه‌گذاری‌شون رو…</div>`,
  chart: `<img class="bg" src="${F(1000)}">
    <div class="stock"><div style="display:flex; justify-content:space-between; align-items:flex-start; direction:ltr">
      <div><div style="font-weight:900; font-size:44px">Gold</div><div style="font-weight:500; font-size:22px; color:#8a8a92">COMEX · 2Y · weekly</div></div>
      <div style="text-align:right"><div style="font-weight:900; font-size:44px">$4,188</div><div style="font-weight:800; font-size:28px; color:#1aa760">+57.1%</div></div></div>
      <canvas id="ch" width="840" height="330" style="margin-top:26px"></canvas></div>
    <div class="cap">پس نگو اونی که <span class="now">پو..ل</span> داره</div>`,
}[SC];
document.getElementById("root").innerHTML = S + `<div class="grain"></div>`;
(async () => {
  for (const f of ["900 60px Vaz", "800 30px Vaz", "700 30px Vaz", "500 30px Vaz"]) await document.fonts.load(f);
  if (SC === "chart") { const tl = await (await fetch("tl.json")).json(), C = tl.gold.candles, c = document.getElementById("ch").getContext("2d");
    const lo = Math.min(...C.map(x => x[4])), hi = Math.max(...C.map(x => x[4])), X = i => i / (C.length - 1) * 840, Y = v => 310 - (v - lo) / (hi - lo) * 290;
    const g = c.createLinearGradient(0, 0, 0, 330); g.addColorStop(0, "rgba(26,167,96,.25)"); g.addColorStop(1, "rgba(26,167,96,0)");
    c.beginPath(); c.moveTo(0, 330); C.forEach((x, i) => c.lineTo(X(i), Y(x[4]))); c.lineTo(840, 330); c.fillStyle = g; c.fill();
    c.beginPath(); C.forEach((x, i) => i ? c.lineTo(X(i), Y(x[4])) : c.moveTo(0, Y(x[4]))); c.strokeStyle = "#1aa760"; c.lineWidth = 5; c.stroke(); }
  await Promise.all([...document.images].map(i => i.decode().catch(() => {}))); document.title = "done";
})();
</script></body></html>
