<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><style>
@font-face { font-family: "Vaz"; src: url("../../../fonts/Vazirmatn-Black.ttf"); font-weight: 900; }
@font-face { font-family: "Vaz"; src: url("../../../fonts/Vazirmatn-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Vaz"; src: url("../../../fonts/Vazirmatn-Medium.ttf"); font-weight: 500; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1080px; height: 1920px; overflow: hidden; font-family: "Vaz"; color: #fff; position: relative; }
.bg { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; filter: contrast(1.06) saturate(1.05); }
.phone { position: absolute; left: 640px; top: 150px; width: 380px; height: 780px; border-radius: 56px; background: #111; padding: 14px; transform: rotate(3deg);
  box-shadow: 0 40px 90px rgba(0,0,0,.55), inset 0 0 0 3px #2a2a2e; }
.scr { width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: repeating-linear-gradient(135deg, #f3f3f5 0 22px, #e9e9ee 22px 44px); display: flex; align-items: center; justify-content: center; text-align: center; color: #666; font-weight: 700; font-size: 28px; line-height: 1.6; }
.hl { position: absolute; left: 650px; top: 600px; width: 350px; height: 96px; border: 7px solid #ffd84a; border-radius: 22px; transform: rotate(3deg); box-shadow: 0 0 0 9999px rgba(0,0,0,0); }
.src { position: absolute; left: 660px; top: 960px; padding: 10px 26px; border-radius: 999px; background: #fff; color: #111; font-weight: 700; font-size: 30px; white-space: nowrap; }
.cap { position: absolute; left: 50px; right: 50px; bottom: 360px; text-align: center; font-weight: 900; font-size: 74px; line-height: 1.3; text-shadow: 0 3px 6px rgba(0,0,0,.6), 0 8px 30px rgba(0,0,0,.5); }
.cap .now { color: #ffd84a; }
</style></head><body>
<img class="bg" src="../frames/f_00095.jpg">
<div class="phone"><div class="scr">اسکرین‌شات واقعی<br>صفحه‌ی آیفون ۱۸ پرومکس<br>در دیجی‌کالا<br><span style="font-size:26px; font-weight:500">(از گوشی شما)</span></div></div>
<div class="hl"></div>
<div class="src">منبع: دیجی‌کالا · مهر ۱۴۰۵</div>
<div class="cap">آیفون ۱۸ پرومکس، <span class="now">۷۳۰</span> میلیون تومن</div>
<script>document.fonts.ready.then(() => document.title = "done")</script></body></html>
